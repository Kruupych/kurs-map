<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Курсы рядом</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="map-area">
    <div id="map" aria-label="Карта отделений"></div>
    <div class="toolbar">
      <div class="toolbar__row">
        <div class="segmented" id="side" role="group" aria-label="Операция">
          <button type="button" data-value="buy">Купить</button>
          <button type="button" data-value="sell">Сдать</button>
        </div>
        <div class="segmented" id="currency" role="group" aria-label="Валюта">
          <button type="button" data-value="usd">USD</button>
          <button type="button" data-value="eur">EUR</button>
          <button type="button" data-value="rub">RUB</button>
        </div>
      </div>
      <div class="toolbar__row">
        <div class="dropdown">
          <button type="button" class="chip chip--menu" id="radius-button" aria-haspopup="menu" aria-expanded="false" aria-controls="radius-menu"></button>
          <div class="menu" id="radius-menu" role="menu" hidden>
            <button type="button" role="menuitemradio" data-value="1">В радиусе 1 км</button>
            <button type="button" role="menuitemradio" data-value="3">В радиусе 3 км</button>
            <button type="button" role="menuitemradio" data-value="5">В радиусе 5 км</button>
            <button type="button" role="menuitemradio" data-value="all">По всему городу</button>
          </div>
        </div>
        <button type="button" class="chip" id="open-only">Открытые</button>
        <button type="button" class="chip chip--menu" id="amount-button" aria-haspopup="dialog"></button>
        <button type="button" class="chip chip--menu" id="city-button" aria-haspopup="dialog"></button>
      </div>
      <div class="notice" id="notice" hidden>
        <p id="notice-text"></p>
        <div class="notice__actions">
          <button type="button" id="notice-retry">Определить снова</button>
          <button type="button" id="notice-close">Скрыть</button>
        </div>
      </div>
    </div>
    <button type="button" class="locate" id="locate" aria-label="Показать моё местоположение">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7" fill="none"/></svg>
    </button>
  </main>

  <section class="sheet" id="sheet">
    <button type="button" class="sheet__toggle" id="sheet-toggle" aria-expanded="false" aria-label="Развернуть список"></button>
    <div class="summary" id="summary" aria-live="polite"></div>
    <ol class="list" id="list"></ol>
    <footer class="status">
      <span id="status-text" aria-live="polite"></span>
      <button type="button" id="refresh" class="refresh" aria-label="Обновить курсы">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
      </button>
    </footer>
  </section>

  <dialog class="dialog" id="amount-dialog" aria-labelledby="amount-title">
    <form method="dialog" class="dialog__body" id="amount-form">
      <h2 id="amount-title">Сумма обмена</h2>
      <p class="dialog__hint">Список покажет, сколько вы получите или заплатите в каждом отделении.</p>
      <label class="amount-field">
        <input type="text" id="amount-input" inputmode="decimal" autocomplete="off" placeholder="0">
        <span id="amount-unit">USD</span>
      </label>
      <div class="quick-amounts" id="quick-amounts"></div>
      <div class="dialog__actions">
        <button type="button" class="button button--plain" id="amount-clear">Без суммы</button>
        <button type="submit" class="button" value="apply">Показать</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog dialog--tall" id="city-dialog" aria-labelledby="city-title">
    <div class="dialog__body">
      <div class="dialog__header">
        <h2 id="city-title">Город</h2>
        <button type="button" class="button button--plain" id="city-close">Закрыть</button>
      </div>
      <input type="search" class="city-search" id="city-search" placeholder="Найти город" autocomplete="off" aria-label="Найти город">
      <ul class="city-list" id="city-list"></ul>
    </div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
