<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Курсы рядом</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="map-area">
    <div id="map" aria-label="Карта отделений"></div>
    <div class="toolbar">
      <div class="segmented" id="side" role="group" aria-label="Операция">
        <button type="button" data-value="buy">Купить</button>
        <button type="button" data-value="sell">Сдать</button>
      </div>
      <div class="segmented" id="currency" role="group" aria-label="Валюта">
        <button type="button" data-value="usd">USD</button>
        <button type="button" data-value="eur">EUR</button>
        <button type="button" data-value="rub">RUB</button>
      </div>
    </div>
    <button type="button" class="locate" id="locate" aria-label="Показать моё местоположение">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7" fill="none"/></svg>
    </button>
  </main>

  <section class="sheet" id="sheet">
    <header class="sheet__head">
      <button type="button" class="sheet__toggle" id="sheet-toggle" aria-expanded="false" aria-label="Развернуть список"></button>
      <div class="summary" id="summary" aria-live="polite"></div>
      <div class="filters">
        <div class="segmented segmented--small" id="radius" role="group" aria-label="Радиус">
          <button type="button" data-value="1">1 км</button>
          <button type="button" data-value="3">3 км</button>
          <button type="button" data-value="5">5 км</button>
          <button type="button" data-value="all">Город</button>
        </div>
        <label class="check">
          <input type="checkbox" id="open-only">
          <span>Открытые</span>
        </label>
        <div class="segmented segmented--small" id="sort" role="group" aria-label="Сортировка">
          <button type="button" data-value="price">По курсу</button>
          <button type="button" data-value="distance">Ближе</button>
        </div>
        <label class="amount">
          <input type="text" id="amount" inputmode="decimal" autocomplete="off" placeholder="Сумма" aria-label="Сумма обмена">
          <span id="amount-unit">USD</span>
        </label>
      </div>
    </header>
    <ol class="list" id="list"></ol>
    <footer class="status">
      <select id="city" aria-label="Город"></select>
      <span id="status-text" aria-live="polite"></span>
      <button type="button" id="refresh" class="refresh" aria-label="Обновить курсы">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
      </button>
    </footer>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
